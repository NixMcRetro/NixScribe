name: Build macOS app

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:
    branches: [main]

concurrency:
  group: nixscribe-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read

jobs:
  build-macos-arm64:
    name: macOS arm64
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Test formatting, models, cache handling and audio export
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Test prompt controls without inference
        run: node --test tests/test_prompt_controls.js

      - name: Require supplied icon for stable releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: test -s assets/NixScribe-master.png

      - name: Build NixScribe
        run: |
          chmod +x build_macos_app.sh
          ./build_macos_app.sh

      - name: Test application job lifecycle without inference
        run: .build-venv/bin/python -m unittest discover -s tests -p "test_job_lifecycle.py" -v

      - name: Verify prompt preparation and pinned decoder contract without inference
        run: |
          .build-venv/bin/python -m unittest discover -s tests -p "test_prompt_handling.py" -v
          .build-venv/bin/python -m unittest discover -s tests -p "installed_prompt_contract.py" -v

      - name: Verify macOS bundle
        run: |
          file "dist/NixScribe.app/Contents/MacOS/NixScribe"
          file "dist/NixScribe.app/Contents/MacOS/NixScribe" | grep -q "arm64"
          /usr/bin/codesign --verify --deep --strict --verbose=2 "dist/NixScribe.app"
          test -s "dist/NixScribe.app/Contents/Resources/NixScribe.icns"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIconFile" "dist/NixScribe.app/Contents/Info.plist" | grep -q "NixScribe.icns"

      - name: Verify packaged ML backend API
        run: |
          "dist/NixScribe.app/Contents/MacOS/NixScribe" --self-test-backend

      - name: Verify packaged clustering cache adapter (synthetic, no inference)
        run: |
          "dist/NixScribe.app/Contents/MacOS/NixScribe" --clustering-probe --self-test

      - name: Verify bundled MLX package and Metal shaders
        run: |
          "dist/NixScribe.app/Contents/MacOS/NixScribe" --self-test-mlx-package

      - name: Verify bundled FluidAudio helper and license
        run: |
          HELPER="dist/NixScribe.app/Contents/Resources/bin/NixScribeDiarizer"
          file "$HELPER" | grep -q arm64
          "$HELPER" --self-test
          test -s "dist/NixScribe.app/Contents/Resources/licenses/FluidAudio/LICENSE"

      - name: Verify frozen native macOS imports
        run: |
          "dist/NixScribe.app/Contents/MacOS/NixScribe" --self-test-native

      - name: Smoke-test frozen app
        shell: bash
        run: |
          set -euo pipefail
          export WHISPERX_UI_NO_BROWSER=1
          "dist/NixScribe.app/Contents/MacOS/NixScribe" > /tmp/nixscribe-smoke.log 2>&1 &
          APP_PID=$!

          cleanup() {
            kill "$APP_PID" >/dev/null 2>&1 || true
            wait "$APP_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl -fsS "http://127.0.0.1:8765/" > /tmp/nixscribe-index.html; then
              grep -q "<title>NixScribe</title>" /tmp/nixscribe-index.html
              grep -q 'class="progress-strip hidden"' /tmp/nixscribe-index.html
              grep -q 'data-repository="mobiuslabsgmbh/faster-whisper-large-v3-turbo"' /tmp/nixscribe-index.html
              grep -q 'data-repository="distil-whisper/distil-large-v3.5-ct2"' /tmp/nixscribe-index.html
              grep -q 'data-repository="mlx-community/whisper-large-v3-mlx"' /tmp/nixscribe-index.html
              grep -q 'data-repository="mlx-community/whisper-large-v3-turbo"' /tmp/nixscribe-index.html
              grep -q 'id="diarizationDevice"' /tmp/nixscribe-index.html
              grep -q 'id="mlxPrecision"' /tmp/nixscribe-index.html
              grep -q 'id="promptCount"' /tmp/nixscribe-index.html
              grep -q 'id="effectivePrompt"' /tmp/nixscribe-index.html
              curl -fsS -X POST -H 'Content-Type: application/json' -H 'X-NixScribe-Action: prompt-preview' -d '{"model":"mlx-large-v3","initial_prompt":"A technical interview.","hotwords":"oscilloscope"}' http://127.0.0.1:8765/api/prompt-preview > /tmp/nixscribe-prompt.json
              python -c 'import json; p=json.load(open("/tmp/nixscribe-prompt.json")); assert p["available"] and not p["over_limit"] and p["effective_tokens"] > 0 and p["initial_prompt"] == "A technical interview.\n\noscilloscope" and p["hotwords"] == ""'
              grep -q 'id="hotwordsHint"' /tmp/nixscribe-index.html
              grep -q 'id="australianSpellingBtn"' /tmp/nixscribe-index.html
              grep -q 'class="brand-icon"' /tmp/nixscribe-index.html
              curl -fsS "http://127.0.0.1:8765/branding/icon.png" -o /tmp/nixscribe-icon.png
              file /tmp/nixscribe-icon.png | grep -q 'PNG image data'
              grep -q 'value="mps" selected' /tmp/nixscribe-index.html
              grep -q 'value="auto" selected' /tmp/nixscribe-index.html
              grep -q 'id="exportLogBtn"' /tmp/nixscribe-index.html
              grep -q 'id="recognitionActual"' /tmp/nixscribe-index.html
              grep -q 'value="intelligent-auto-v5"' /tmp/nixscribe-index.html
              grep -q 'value="mlx-large-v3".*selected' /tmp/nixscribe-index.html
              echo "Frozen NixScribe app launched and served its UI successfully."
              exit 0
            fi
            sleep 1
          done

          echo "NixScribe did not become ready during the smoke test."
          cat /tmp/nixscribe-smoke.log
          exit 1

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: NixScribe-macOS-arm64
          path: dist/NixScribe-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 3

  publish-release:
    name: Publish stable release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build-macos-arm64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Check release tag matches app version
        run: |
          test "$GITHUB_REF_NAME" = "v$(python -c 'from app_config import VERSION; print(VERSION)')"
      - uses: actions/download-artifact@v7
        with:
          name: NixScribe-macOS-arm64
          path: dist
      - name: Publish versioned app and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists; refusing to overwrite stable assets."
            exit 1
          fi
          cd dist
          mv NixScribe-macOS-arm64.zip "NixScribe-$GITHUB_REF_NAME-macOS-arm64.zip"
          sha256sum "NixScribe-$GITHUB_REF_NAME-macOS-arm64.zip" > "NixScribe-$GITHUB_REF_NAME-macOS-arm64.zip.sha256"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag --title "NixScribe $GITHUB_REF_NAME" --generate-notes \
            "NixScribe-$GITHUB_REF_NAME-macOS-arm64.zip" \
            "NixScribe-$GITHUB_REF_NAME-macOS-arm64.zip.sha256"
