name: Build macOS app

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-macos-arm64:
    name: macOS arm64
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install ffmpeg
        run: brew install ffmpeg

      - name: Build NixScribe
        run: |
          chmod +x build_macos_app.sh
          ./build_macos_app.sh

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: NixScribe-macOS-arm64
          path: dist/NixScribe-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 14

      - name: Publish tagged release asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --title "NixScribe $GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" dist/NixScribe-macOS-arm64.zip --clobber
